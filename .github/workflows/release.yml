name: Release

# 打 tag（如 v0.2.0）时：在三平台构建 release 二进制，并作为资产上传到该 tag 的 GitHub Release。
# 这些资产供应用内置的自动更新（self_update）按当前平台下载并替换二进制用。
# Linux 额外用 cargo-packager 打 deb + AppImage、Windows 打 NSIS 安装器一并上传，
# 均内置 OCR 模型与相应 GPU provider 库，便于「安装即用 GPU」；macOS 的 app/dmg 仍由
# packaging.yml 产出（仅 workflow 工件）。
#
# 触发方式（两种任选）：
#   1. git tag v0.2.0 && git push origin v0.2.0        → 推送 tag 即自动触发
#   2. GitHub 页面 → Actions → 本工作流 → Run workflow 手动触发
#
# 资产命名：`screenshot-rs-<target-triple>`（含 target triple，self_update 的 asset_for
# 用它匹配当前平台）。每个平台都是一份该平台默认 GPU 的裸二进制（CUDA/DirectML/CoreML），
# 运行时自动检测，无 GPU 自动回退 CPU。
#
# ⚠️ Linux 必须用 ubuntu-24.04：ORT(onnxruntime) 的预编译二进制在 glibc≥2.38 / GCC13+
# 上构建，引用了 __isoc23_strtol、_M_replace_cold 等新符号。ubuntu-22.04(glibc 2.35/GCC11)
# 链接会失败（undefined symbol）。ubuntu-24.04 与 packaging.yml 的 ubuntu-latest 一致能通过。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            asset: screenshot-rs-x86_64-unknown-linux-gnu
            # ONNX Runtime CUDA provider 动态库（ort-sys 构建时放进 target/release/，运行时 dlopen）。
            # 一并上传让「裸装」也能有 GPU：把二进制与这些库放同一目录即可命中（见 build.rs 的 $ORIGIN）。
            # 与 packager.toml 一致，只打包 cuda + shared（TensorRT 不打：需专用卡且让 linuxdeploy 扫依赖）。
            provider_files: target/release/libonnxruntime_providers_cuda.so,target/release/libonnxruntime_providers_shared.so
            # deb + AppImage 安装包（内置 OCR small 模型 + CUDA provider 库，安装即用 GPU，无卡回退 CPU）。
            package_files: dist/*.deb,dist/*.AppImage
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            asset: screenshot-rs-x86_64-pc-windows-msvc.exe
            # Windows 的 ORT provider 是 .dll，放 exe 同目录即被加载（Windows 默认先搜 exe 目录）。
            provider_files: target/release/onnxruntime_providers_*.dll,target/release/onnxruntime.dll
            # NSIS 安装器（currentUser、免管理员；内置二进制 + provider .dll + OCR 模型，安装即用 GPU）
            package_files: dist/*.exe
          - os: macos-latest
            triple: aarch64-apple-darwin
            asset: screenshot-rs-aarch64-apple-darwin
            # macOS 用 CoreML（系统内建），无独立 provider 库，无需额外资产。
            provider_files: ""
            package_files: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Linux 需要 GTK / X11 / Wayland 等系统库（与 packaging.yml 一致）
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libglib2.0-dev libx11-dev libxdo-dev \
            libayatana-appindicator3-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxrandr-dev libxinerama-dev libxtst-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxcomposite-dev \
            libxdamage-dev libxcb1-dev libxcb-render0-dev libx11-xcb-dev \
            libxext-dev libfontconfig-dev libegl-dev libgles-dev libgl-dev \
            libpng-dev libjpeg-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 各平台默认 feature（target 条件依赖已按平台启用 GPU：Linux→cuda、
      # Windows→cuda+directml、macOS→coreml），无需显式 --features。
      - name: Build release binary
        run: cargo build --release

      # 二进制重命名为带 target-triple 的资产名，供 self_update 匹配下载。
      - name: Stage asset (Linux / macOS)
        if: runner.os != 'Windows'
        run: cp target/release/screenshot-rs "${{ matrix.asset }}"

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        run: copy target\release\screenshot-rs.exe "${{ matrix.asset }}"

      # 打包 deb + AppImage（cargo-packager）：内含 OCR small 模型 + ONNX Runtime
      # CUDA provider 库。deb 装到 /usr/bin + /usr/lib/screenshot-rs/（RUNPATH 命中），
      # AppImage 自包含；无 GPU 自动回退 CPU。
      - name: Install cargo-packager (Linux)
        if: runner.os == 'Linux'
        run: cargo install cargo-packager --version 0.11.8 --locked

      # linuxdeploy 扫描 libonnxruntime_providers_cuda.so 的 NEEDED 依赖（CUDA 运行库
      # libcublas 等），构建机无 NVIDIA 找不到会中止。注入 build.rs 生成的 0 字节 stub
      # 到宿主机让解析通过；成品 AppImage 由 excluded-libraries 排除它们，运行时由
      # 客户机 NVIDIA 驱动提供真库（有卡 GPU、无卡 CPU）。
      - name: Inject CUDA stub libs for linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp target/release/cuda-stubs/* /usr/lib/x86_64-linux-gnu/

      - name: Package deb + appimage (Linux)
        if: runner.os == 'Linux'
        run: cargo packager -c packager.toml -f deb,appimage

      # Windows 打包 NSIS 安装器（cargo-packager）：currentUser 模式、免管理员、
      # 内置二进制 + provider .dll + OCR small 模型，安装即用 DirectML/CUDA（无 GPU 回退 CPU）。
      - name: Install cargo-packager (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package nsis (Windows)
        if: runner.os == 'Windows'
        run: cargo packager -c packager.toml -f nsis

      # 并行各 job 都打到同一个 Release（按 tag 创建/更新），并追加各自的资产。
      # 建议配合勾选 "Generate release notes"。
      - name: Upload asset to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.provider_files }}
            ${{ matrix.package_files }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
