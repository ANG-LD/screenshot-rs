[package]
name = "screenshot-rs"
version = "0.1.0"
edition = "2021"
description = "Cross-platform screenshot tool built with GPUI"
license = "MIT"

# GPU 推理：**默认 `cargo build --release` 即带平台加速能力**（见下方 target 条件依赖），
# 启动时自动检测客户机硬件——有 GPU 用 GPU，没有用 CPU。也可显式指定：
#   Linux/Windows: --features ocr-cuda   （NVIDIA，一个包同时含 CPU+CUDA）
#   macOS:         --features ocr-coreml （Apple 芯片 GPU/神经引擎加速）
#   Windows 通用:   --features ocr-directml （AMD/Intel/NVIDIA 均可）
#   Intel:         --features ocr-openvino
# 构建指引见 README「推理后端」。
[features]
default = []
ocr-cuda = ["oar-ocr/cuda"]
ocr-coreml = ["oar-ocr/coreml"]
ocr-directml = ["oar-ocr/directml"]
ocr-openvino = ["oar-ocr/openvino"]

[dependencies]
# GPUI（Zed 团队，固定 commit 以保证可复现构建）
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "951e3de" }
# 默认资源（图标 / 字体），与 gpui-component 同 rev 以避免 links 冲突
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "951e3de" }

# 屏幕捕获（跨平台 crate）
screenshots = "0.6"

# 系统集成
global-hotkey = "0.6"
tray-icon = "0.11"
arboard = "3"
image = "0.25"

# 用户配置目录（跨平台 config_dir / home_dir）
dirs = "6"

# PaddleOCR（PP-OCRv6）本地推理：替换 tesseract CLI，中文准确率更高。
# 依赖 oar-ocr 包装（内部为 ONNX Runtime；下方 target 条件依赖使默认构建带平台加速 EP）。
oar-ocr = "0.9"
# ort 运行时设备探测（与 oar-ocr 内部同一版本，避免两个 ORT 全局实例冲突；
# 只用于检测 CUDA 设备，session 仍由 oar-ocr 创建）
ort = "=2.0.0-rc.13"

# OCR 模型下载（首次使用时从 GitHub release 拉取 PP-OCRv6 模型到缓存目录）
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 应用自更新：启动时查 GitHub Releases，用户确认后下载并替换运行中的二进制。
# default-features=false + rustls：避免 openssl/native-tls 重依赖；单二进制无需归档解压。
self_update = { version = "0.41", default-features = false, features = ["rustls"] }

# 版本语义比较（更新检查用）
semver = "1"
# 更新检查解析 GitHub Releases JSON（已随其它依赖缓存）
serde_json = "1"

# 错误处理与日志
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 序列化
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# GPUI 内部用的小数组（RenderImage::new 需要）
smallvec = "1"
cosmic-text = "0.19"
once_cell = "1.21.4"

# X11 原生窗口操作（Pin 窗口精确放置）
raw-window-handle = "0.6"

# ── 默认构建即带 GPU 加速能力 ──────────────────────────────────────────────
# Cargo 的 feature 在依赖图中全局合并：这里给 oar-ocr 追加的 EP feature 会一路
# 传导到 oar-ocr-core → ort，ort-sys 构建时据此下载**含对应 EP 的预编译 ONNX
# Runtime**（静态链接 libonnxruntime.a），启动时按真实硬件自动选择（见
# paddle.rs `detect_accelerator`）——有 GPU 用 GPU，没有用 CPU，无需配置。
#   Linux x86_64   : cuda         → cuda13,tensorrt,nvrtx 分发（NVIDIA CUDA EP）
#   Windows x86_64 : cuda,directml→ cuda13,tensorrt,nvrtx,directml 分发
#                    （CUDA + DirectML，NVIDIA / AMD / Intel 显卡全覆盖）
#   macOS          : coreml       → CoreML 分发（Apple Silicon GPU / 神经引擎）
# 其余平台（aarch64 Linux 等）无对应预编译分发，保持纯 CPU 以免构建失败；
# 显式 --features ocr-cuda / ocr-directml / ocr-coreml 仍可强制指定对应后端。
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
oar-ocr = { version = "0.9", features = ["cuda"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
oar-ocr = { version = "0.9", features = ["cuda", "directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
oar-ocr = { version = "0.9", features = ["coreml"] }
# 滚动截屏注入器：合成滚轮事件（CGEventCreateScrollWheelEvent），绑定 CoreGraphics
# 系统框架；需要 highsierra feature 才有 `CGEvent::new_scroll_event`。
core-graphics = { version = "0.24", features = ["highsierra"] }

# GTK 初始化（Linux 托盘依赖）+ X11 窗口操作 / 滚动注入。
# x11rb 的 xtest/xcb 特性会链接系统 libxcb（xcb.lib），只存在于 Linux，必须按平台隔离。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xtest", "shm"] }

# Win32 消息泵（Windows 下 global-hotkey / tray-icon 必须在创建线程上跑消息循环才能派发事件）
# + ReleaseCapture（Pin 窗口标题栏拖拽）+ ClientToScreen（诊断 pin 客户端原点）
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory"] }

# 构建期把 assets/icons/screenshot-rs.ico 嵌入 exe 资源段（见 build.rs），
# 否则 Windows 资源管理器/任务栏显示通用图标。
[target.'cfg(target_os = "windows")'.build-dependencies]
# 用 3.x：compile() 返回 Result（2.x 返回 ()，无法 .expect）。
# 且 3.0.11 已在依赖树中（gpui 也在用），可去重、少编译一份。
embed-resource = "3"

# gpui-component 的本地修补版：把 Root::tooltip_overlay 与 TooltipOverlay::hide
# 从 pub(crate) 改为 pub，供项目在窗口复用会话开始时清除跨会话残留的 tooltip
# 浮层（third_party/gpui-component 是 951e3de 的最小副本，仅 ui/macros/assets 三个 crate）。
[patch."https://github.com/longbridge/gpui-component"]
gpui-component = { path = "third_party/gpui-component/crates/ui" }
gpui-component-assets = { path = "third_party/gpui-component/crates/assets" }

[profile.release]
opt-level = "z"          # 优化目标为大小 (size optimization)
lto = "fat"              # 完整的链接时优化 (full LTO)
codegen-units = 1        # 最小化编译单元以获得最佳优化
strip = true             # 自动移除符号和调试信息
panic = "abort"          # 使用 abort 代替 unwind，减少二进制大小
