[package]
name = "screenshot-rs"
version = "0.1.0"
edition = "2021"
description = "Cross-platform screenshot tool built with GPUI"
license = "MIT"

[dependencies]
# GPUI（Zed 团队，固定 commit 以保证可复现构建）
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "951e3de" }
# 默认资源（图标 / 字体），与 gpui-component 同 rev 以避免 links 冲突
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "951e3de" }

# 屏幕捕获（跨平台 crate）
screenshots = "0.6"

# 系统集成
global-hotkey = "0.6"
tray-icon = "0.11"
arboard = "3"
image = "0.25"

# 错误处理与日志
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 异步运行时（外部 crate 需要）
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI 内部用的小数组（RenderImage::new 需要）
smallvec = "1"
cosmic-text = "0.19"
once_cell = "1.21.4"

# X11 原生窗口操作（Pin 窗口精确放置）
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# GTK 初始化（Linux 托盘依赖）
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
