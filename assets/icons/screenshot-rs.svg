<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：深蓝到紫罗兰 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4361EE"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <!-- 表面高光 -->
    <radialGradient id="gloss" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- 取景框纯白 -->
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0eeff"/>
    </linearGradient>
  </defs>

  <!-- 投影 -->
  <rect x="14" y="16" width="104" height="104" rx="26" ry="26" fill="#000000" opacity="0.15"/>

  <!-- 主体背景 -->
  <rect x="12" y="12" width="104" height="104" rx="26" ry="26" fill="url(#bg)"/>

  <!-- 表面高光 -->
  <rect x="12" y="12" width="104" height="104" rx="26" ry="26" fill="url(#gloss)"/>

  <!-- 取景框 -->
  <rect x="26" y="24" width="76" height="80" rx="10" ry="10" fill="none" stroke="url(#frame)" stroke-width="3.5"/>

  <!-- 四角 L 形取景器 -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <!-- 左上 -->
    <path d="M 26 40 V 28 Q 26 24 30 24 H 44"/>
    <!-- 右上 -->
    <path d="M 84 24 H 98 Q 102 24 102 28 V 40"/>
    <!-- 左下 -->
    <path d="M 26 88 V 100 Q 26 104 30 104 H 44"/>
    <!-- 右下 -->
    <path d="M 84 104 H 98 Q 102 104 102 100 V 88"/>
  </g>

  <!-- 中心十字准星 -->
  <circle cx="64" cy="64" r="8" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="53" x2="64" y2="56"/>
    <line x1="64" y1="72" x2="64" y2="75"/>
    <line x1="53" y1="64" x2="56" y2="64"/>
    <line x1="72" y1="64" x2="75" y2="64"/>
  </g>
</svg>
