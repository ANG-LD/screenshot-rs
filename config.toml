# screenshot-rs 运行时配置模板
#
# 本文件是应用内置的默认模板。应用首次运行时，会自动在配置目录生成一份
# 同名文件（config.toml），你直接编辑它即可生效，无需手动复制。
# 生成位置：
#   Linux:   ~/.config/screenshot-rs/config.toml
#   macOS:   ~/Library/Application Support/screenshot-rs/config.toml
#   Windows: %APPDATA%\screenshot-rs\config.toml
#
# 也可用环境变量 SCREENSHOT_RS_CONFIG 指定任意路径。
#
# 优先级：环境变量 > config.toml > 内置默认值
# 所有字段均可选，缺失即回落默认；路径支持以 ~ 开头表示用户主目录。

[ocr]

# PaddleOCR 模型目录。指定后直接使用该目录下的模型文件（不再自动下载）。
# 目录需包含三个文件：
#   pp-ocrv6_medium_det.onnx   （检测模型，约 62 MB）
#   pp-ocrv6_medium_rec.onnx   （识别模型，约 76 MB）
#   ppocrv6_dict.txt           （词典，18708 字符）
# 也可用环境变量 OCR_MODEL_DIR 覆盖。
# 不填则依次查找：项目内 models/PP-OCRv6 → 缓存目录（自动下载）。
# model_dir = "/data/PP-OCRv6"

# 模型下载缓存目录。不填则用系统缓存目录
# （Linux/macOS: ~/.cache/screenshot-rs，Windows: %LOCALAPPDATA%\screenshot-rs）。
# 也可用环境变量 OCR_CACHE_DIR 覆盖。
# cache_dir = "/data/ocr-cache"
