# screenshot-rs 运行时配置模板
#
# 本文件是应用内置的默认模板。应用首次运行时，会自动在配置目录生成一份
# 同名文件（config.toml），你直接编辑它即可生效，无需手动复制。
# 生成位置：
#   Linux:   ~/.config/screenshot-rs/config.toml
#   macOS:   ~/Library/Application Support/screenshot-rs/config.toml
#   Windows: %APPDATA%\screenshot-rs\config.toml
#
# 也可用环境变量 SCREENSHOT_RS_CONFIG 指定任意路径。
#
# 优先级：环境变量 > config.toml > 内置默认值
# 所有字段均可选，缺失即回落默认；路径支持以 ~ 开头表示用户主目录。

[hotkey]

# 截图触发热键。默认 alt+s。
# 写法：修饰键 + ... + 主键，用 + 分隔，大小写与空格不敏感。
#   修饰键：ctrl(control) / alt(option) / shift / super(cmd, win, meta)
#   主键：  a-z、0-9、f1-f24，以及 space enter esc tab backspace delete insert
#          home end pageup pagedown up down left right printscreen 和 - = , . / ; ' ` [ ] \
# 例：screenshot = "ctrl+shift+a"、screenshot = "super+printscreen"
# 也可用环境变量 SCREENSHOT_RS_HOTKEY 覆盖（优先级更高）。
# 注意：至少要带一个修饰键（裸键做全局热键会抢掉全系统那个按键）；
#       配错不会让应用起不来——会记一条 warn 并回退 alt+s。
# screenshot = "alt+s"

[translate]

# 英译中模型的下载基址。留空 = 官方 HuggingFace 优先、hf-mirror.com 兜底
# （国内直连 huggingface.co 基本不通，实测 8s 超时）。
# 内网自建镜像或离线分发时填自己的地址，例如：
# base_url = "https://内网地址/opus-mt-en-zh/resolve/main"
# 也可用环境变量 SCREENSHOT_RS_TRANSLATE_BASE_URL 覆盖。
# base_url = ""

[ocr]

# 模型档位：small（默认）或 medium。
# small ≈30MB：CPU 上快（代码区 14 行实测 0.77s），准确率 ~95%。
# medium ≈132MB：准确率更高（~99%），但 CPU 上多行场景慢（~14s）。
# 也可用环境变量 OCR_MODEL_TIER 覆盖。
# model_tier = "small"

# 推理后端：auto（默认，运行时自动检测）/ cpu / cuda / directml / openvino。
# auto = 有 NVIDIA 显卡（驱动+CUDA 运行库）用 GPU，否则用 CPU，无需配置。
# 也可用环境变量 OCR_EXECUTION_PROVIDER 覆盖。
# execution_provider = "auto"

# PaddleOCR 模型目录。指定后直接使用该目录下的模型文件（不再自动下载）。
# 目录需包含三个文件（文件名随档位）：
#   small: pp-ocrv6_small_det.onnx / pp-ocrv6_small_rec.onnx / ppocrv6_dict.txt
#   medium: pp-ocrv6_medium_det.onnx / pp-ocrv6_medium_rec.onnx / ppocrv6_dict.txt
# 也可用环境变量 OCR_MODEL_DIR 覆盖。
# 不填则依次查找：项目内 models/PP-OCRv6 → 缓存目录（自动下载）。
# model_dir = "/data/PP-OCRv6"

# 模型下载缓存目录。不填则用系统缓存目录
# （Linux/macOS: ~/.cache/screenshot-rs，Windows: %LOCALAPPDATA%\screenshot-rs）。
# 也可用环境变量 OCR_CACHE_DIR 覆盖。
# cache_dir = "/data/ocr-cache"
