name = "screenshot-rs"
product-name = "Screenshot RS"
version = "0.1.1"
identifier = "com.screenshot-rs.screenshot-rs"
description = "Cross-platform screenshot tool built with GPUI"
homepage = "https://github.com/ANG-LD/screenshot-rs"
authors = ["Lidong yang <735615901@qq.com>"]
publisher = "Lidong yang <735615901@qq.com>"
license-file = "LICENSE"
copyright = "Copyright 2026 screenshot-rs team"
category = "GraphicsAndDesign"

icons = [
    "assets/icons/app-128.png",
    "assets/icons/app-256.png",
    "assets/icons/screenshot-rs.ico",
    "assets/icons/screenshot-rs.icns",
]

out-dir = "./dist"
before-packaging-command = "cargo build --release"
binaries = [{ path = "screenshot-rs", main = true }]
binaries-dir = "target/release"

# small 档 OCR 模型随应用包内置（用户无需联网下载即可用 small 档）：
# 三件套放入安装包的资源目录（deb/appimage: /usr/lib/<exe>/，
# Windows: exe 同目录，macOS: Contents/Resources），运行时在
# `bundled_resource_dirs()` 中按同一约定查找。medium 档模型较大（~132MB）
# 不内置，仍由 OCR 模型管理窗口联网下载。
#
# ONNX Runtime 的 CUDA provider 动态库（libonnxruntime_providers_cuda.so +
# libonnxruntime_providers_shared.so，由 ort-sys 构建时下载并复制到
# target/release/）随包分发——ORT 运行时 dlopen 加载它们（二进制 RUNPATH
# 指向本资源目录，见 build.rs）。无对应文件的平台（macOS CoreML 无 provider
# 库）glob 无匹配自动跳过。
# 注意：只打包 cuda + shared（TensorRT 库不打包：需专用推理卡且会让
# linuxdeploy 扫描额外依赖）；CUDA 运行库（libcublas/libcudart 等）不打包，
# 由客户机的 NVIDIA 驱动提供（AppImage 构建见 packaging.yml 的 stub 注入 +
# 下方 excluded-libraries）。
resources = [
    { src = "models/paddle/pp-ocrv6_small_det.onnx", target = "pp-ocrv6_small_det.onnx" },
    { src = "models/paddle/pp-ocrv6_small_rec.onnx", target = "pp-ocrv6_small_rec.onnx" },
    { src = "models/paddle/ppocrv6_dict.txt", target = "ppocrv6_dict.txt" },
    "target/release/libonnxruntime_providers_cuda.so",
    "target/release/libonnxruntime_providers_shared.so",
    "target/release/onnxruntime_providers_*.dll",
    "target/release/onnxruntime.dll",
]

[linux]
generate-desktop-entry = true

# 运行库依赖按 ldd 结果整理；GTK 会传递拉入大部分图形栈（cairo/pango/harfbuzz/X11/Wayland），
# 这里只显式列出非 GTK 传递覆盖的独立库。
[deb]
depends = ["libc6", "libgtk-3-0", "libglib2.0-0", "libx11-6", "libxdo3", "libxtst6", "libwayland-client0", "libayatana-appindicator3-1"]
section = "graphics"
priority = "optional"

[appimage]
# 托盘 dlopen 加载 libayatana-appindicator，linuxdeploy 按 ldd 依赖扫描不会自动打包，
# 需要显式指定，否则 AppImage 里托盘不显示。
libs = ["libayatana-appindicator3.so.1"]
# libonnxruntime_providers_cuda.so 依赖 CUDA 运行库（libcublas 等，构建机无
# NVIDIA 缺失）。CI 先把 build.rs 生成的 0 字节 stub 注入宿主机
# /usr/lib/x86_64-linux-gnu/（见 packaging.yml），linuxdeploy 解析依赖时找到；
# 这里排除它们**不部署进 AppImage**——AppImage 里不含 stub，运行时 CUDA 库
# 由客户机 NVIDIA 驱动提供（有卡 GPU 推理、无卡 CPU）。
excluded-libraries = [
    "libcublas.so.13",
    "libcublasLt.so.13",
    "libcurand.so.10",
    "libcudart.so.13",
    "libcuda.so.1",
]

[appimage.linuxdeploy-plugins]
gtk = "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"

[nsis]
installer-mode = "currentUser"

[macos]
minimum-system-version = "10.15"

[dmg]
# 无额外配置，cargo-packager 用 hdiutil 生成标准只读 DMG
